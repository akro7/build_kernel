name: Build Patched Kernel

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup magiskboot (x86_64)
        run: |
          MAGISK_URL="https://github.com/topjohnwu/Magisk/releases/download/v28.1/Magisk-v28.1.apk"
          wget -q "$MAGISK_URL" -O magisk.apk
          unzip -p magisk.apk lib/x86_64/libmagiskboot.so > magiskboot
          chmod +x magiskboot
          sudo mv magiskboot /usr/local/bin/magiskboot
          magiskboot --version || echo "magiskboot ready"

      - name: Clean split parts and Extract boot.img from ROM
        run: |
          mkdir -p work output patchbootstock
          
          if ls patchbootstock/boot.img.part* 1> /dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm -f patchbootstock/boot.img.part*
            git commit -m "Clean up split boot.img parts"
            git push origin HEAD:${GITHUB_REF_NAME} || true
          fi
          rm -rf patchbootstock/boot.img.part* patchbootstock/boot.img

          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 p7zip-full tar unzip lz4

          ROM_URL="https://xm04."

          aria2c -x 16 -s 16 -k 1M --console-log-level=error --summary-interval=0 -o rom_archive "$ROM_URL"

          file rom_archive

          if 7z l rom_archive 2>/dev/null | grep -q "payload.bin"; then
            7z e rom_archive "payload.bin" -r -y
            rm -f rom_archive
            wget -q https://github.com/ssut/payload-dumper-go/releases/download/1.2.2/payload-dumper-go_1.2.2_linux_amd64.tar.gz -O pd.tar.gz
            tar -xzf pd.tar.gz payload-dumper-go
            chmod +x payload-dumper-go
            ./payload-dumper-go -p boot -o patchbootstock payload.bin
            rm -f payload.bin pd.tar.gz payload-dumper-go
          elif 7z l rom_archive 2>/dev/null | grep -E -q "boot\.img|boot\.img\.lz4"; then
            7z e rom_archive "*boot.img*" -r -o"patchbootstock" -y
            rm -f rom_archive
          else
            mkdir -p extracted_rom
            tar -xf rom_archive -C extracted_rom 2>/dev/null || 7z x rom_archive -o"extracted_rom" -y
            rm -f rom_archive
            find extracted_rom -name "boot.img*" -exec cp {} patchbootstock/ \;
            rm -rf extracted_rom
          fi

          if [ -f "patchbootstock/boot.img.lz4" ]; then
            lz4 -d patchbootstock/boot.img.lz4 patchbootstock/boot.img
            rm -f patchbootstock/boot.img.lz4
          fi

          if [ ! -f "patchbootstock/boot.img" ]; then
            exit 1
          fi

          ls -lh patchbootstock/boot.img

      - name: Patch boot.img with new kernel
        run: |
          cd work
          cp ../patchbootstock/boot.img boot.img

          magiskboot unpack boot.img
          ls -lh

          cp ../Image kernel
          ls -lh kernel

          magiskboot repack boot.img patched_boot.img
          ls -lh patched_boot.img

      - name: Verify patched boot.img
        run: |
          mkdir -p verify
          cp work/patched_boot.img verify/
          cd verify

          magiskboot unpack patched_boot.img

          PATCH_SZ=$(stat -c%s kernel)
          echo "KERNEL_SZ: $PATCH_SZ"

          magiskboot decompress kernel kernel_raw 2>&1 || cp kernel kernel_raw

          ORIG_MD5=$(md5sum ../Image | awk '{print $1}')
          PATCH_MD5=$(md5sum kernel_raw | awk '{print $1}')
          echo "ORIG_MD5:  $ORIG_MD5"
          echo "PATCH_MD5: $PATCH_MD5"

          if [ "$ORIG_MD5" != "$PATCH_MD5" ]; then
            exit 1
          fi

      - name: Build AnyKernel3 zip
        run: |
          mkdir -p ak3_package/tools ak3_package/META-INF

          cp anykernel.sh  ak3_package/
          cp banner        ak3_package/
          cp LICENSE       ak3_package/
          cp Image         ak3_package/
          cp -r tools/.    ak3_package/tools/
          cp -r META-INF/. ak3_package/META-INF/

          cd ak3_package
          ZIP_NAME="AnyKernel3-patched-$(date +%Y%m%d-%H%M).zip"
          zip -r9 "../output/${ZIP_NAME}" .
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Prepare output
        run: |
          cp work/patched_boot.img output/
          ls -lh output/

      - name: Upload patched_boot.img
        uses: actions/upload-artifact@v4
        with:
          name: patched_boot
          path: output/patched_boot.img
          retention-days: 7

      - name: Upload AnyKernel3 zip
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3_zip
          path: output/*.zip
          retention-days: 7
